services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: logging-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - "./elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro"
    ports:
      - "9200:9200"
    networks:
      - logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: logging-logstash
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.monitoring.enabled=false
    volumes:
      - "./logstash/pipeline:/usr/share/logstash/pipeline:ro"
      - "./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro"
    ports:
      - "5000:5000"
    networks:
      - logging
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9600/_node/stats >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: logging-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    volumes:
      - "./kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro"
    ports:
      - "5601:5601"
    networks:
      - logging
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  fastapi:
    build: ./app
    container_name: logging-fastapi
    environment:
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5000
    ports:
      - "8000:8000"
    networks:
      - logging
    depends_on:
      logstash:
        condition: service_healthy
    restart: unless-stopped

  kibana-setup:
    image: curlimages/curl:8.10.1
    container_name: logging-kibana-setup
    volumes:
      - "./kibana/dashboards.ndjson:/opt/dashboards.ndjson:ro"
    networks:
      - logging
    depends_on:
      kibana:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Kibana to be ready...";
        for i in $$(seq 1 30); do
          if curl -fs http://kibana:5601/api/status >/dev/null 2>&1; then
            echo "Kibana is up. Importing saved objects...";
            curl -fsS -X POST "http://kibana:5601/api/saved_objects/_import?overwrite=true" \
              -H "kbn-xsrf: true" \
              --form file=@/opt/dashboards.ndjson \
              && echo "Kibana setup OK" && exit 0;
            echo "Import failed, retrying...";
          fi;
          sleep 5;
        done;
        echo "Kibana never became ready"; exit 1
    restart: on-failure

networks:
  logging:
    driver: bridge
    name: logging
