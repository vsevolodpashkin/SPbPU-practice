input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Normalize the @timestamp field if app sends ISO8601 in 'timestamp' or '@timestamp'
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  } else if ![@timestamp] {
    date {
      match => ["message", "ISO8601"]
      target => "@timestamp"
      tag_on_failure => ["_date_parse_failed"]
    }
  }
  # Make sure level is uppercase
  if [level] {
    mutate { uppercase => ["level"] }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }
  # Also print to stdout for debugging
  stdout { codec => rubydebug { metadata => false } }
}
